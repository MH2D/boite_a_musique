[project]
name = "i-am-listening"
version = "0.1.0"
description = "Barcode-triggered music player"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "python-barcode>=0.16.1",
    # Optional 16x2 I2C LCD support (Raspberry Pi). Pure-Python, harmless to
    # install on macOS where display.py stays a no-op.
    "RPLCD>=1.4.0",
    "smbus2>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i_am_listening"]
